when:
  - event: pull_request
    evaluate: 'not (CI_COMMIT_MESSAGE contains "SKIPCI")'

steps:
  - name: dialyzer
    image: nixos/nix
    environment:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    commands:
      - |
        nix develop path:.#ci --command sh -ec '
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile --warnings-as-errors
          mix dialyzer
        '
