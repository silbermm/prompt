when:
  - event: release

steps:
  - name: publish
    image: nixos/nix
    environment:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      HEX_API_KEY:
        from_secret: hex_api_key
    commands:
      - |
        nix develop path:.#ci --command sh -ec '
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix hex.publish --yes
        '
